name: Call Levels
description: >-
  Call Levels was a Singapore-based financial technology company, founded in 2014 by Cynthia Siantar
  and Daniel Chia, that built a real-time financial markets monitoring and price-alert service. Its
  consumer mobile app (iOS and Android) let retail investors set price "call levels" and receive
  real-time alerts across multiple asset classes including forex, commodities, indices and equities,
  serving 500,000+ investors globally. On the institutional side it offered an open API and a
  chatbot/portfolio-management framework marketed to banks and financial institutions for embedding
  market monitoring into legacy systems. The company was backed by 500 Startups (500 Global) via a
  pre-Series A round. As of this profile the primary domain (call-levels.com) resolves to a parked
  registrar lander with no live developer portal, API documentation, or discoverable API surface, so
  the company appears dormant or defunct and no live API artifacts could be harvested.
